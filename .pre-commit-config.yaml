# Install with: uv run pre-commit install
# Hooks use the project's ruff (pinned in uv.lock) and mirror the CI lint job.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check
        language: system
        types_or: [python, pyi]
        files: ^(fis|tests)/
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
        files: ^(fis|tests)/
